packages:
  - packages/*
  - apps/*

engineStrict: true

allowBuilds:
  # The prepare script runs lefthook install.
  lefthook: false
  # Its postinstall only checks the native binary, which arrives as an optional dependency.
  '@swc/core': false
  # Its platform binary also arrives as an optional dependency.
  esbuild: false
  # Its install script downloads the Electron binary.
  electron: true
  # electron-builder builds NSIS installers, not Squirrel.Windows ones.
  electron-winstaller: false
