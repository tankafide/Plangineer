<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Starting Plangineer</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: oklch(0.99 0.002 270);
        --foreground: oklch(0.21 0.012 270);
        --muted-foreground: oklch(0.5 0.014 270);
        --primary: oklch(0.52 0.2 275);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.16 0.006 270);
          --foreground: oklch(0.96 0.004 270);
          --muted-foreground: oklch(0.71 0.012 270);
          --primary: oklch(0.55 0.18 275);
        }
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        text-align: center;
        font-family: system-ui, sans-serif;
        background: var(--background);
        color: var(--foreground);
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .spinner {
        justify-self: center;
        width: 24px;
        height: 24px;
        border: 3px solid color-mix(in oklch, var(--primary) 25%, transparent);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner" role="progressbar" aria-label="Starting"></div>
    <h1>Starting Plangineer</h1>
    <p>Starting the database, the server and this computer's runner.</p>
  </body>
</html>
