services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: plangineer
      POSTGRES_PASSWORD: plangineer
      POSTGRES_DB: plangineer
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'plangineer', '-d', 'plangineer']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
